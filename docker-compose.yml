services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: brasilgrid
      POSTGRES_PASSWORD: brasilgrid
      POSTGRES_DB: brasilgrid
    ports:
      - "5433:5432"
    volumes:
      - brasilgrid_pgdata:/var/lib/postgresql

volumes:
  brasilgrid_pgdata:
